spring:
  application:
    name: beangate
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    async:
      # Long-lived SSE responses must not be cut by the container's 30s async default.
      request-timeout: 600000
  threads:
    virtual:
      # Streaming holds one thread per open conversation; virtual threads keep that cheap.
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      timeout: 500ms
      connect-timeout: 500ms

server:
  # 8080/8081 are used by other projects on this machine; override with SERVER_PORT.
  port: ${SERVER_PORT:18080}
  shutdown: graceful
  compression:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

beangate:
  security:
    # HMAC pepper for API key hashing. CHANGE IN PRODUCTION.
    key-pepper: ${BEANGATE_KEY_PEPPER:dev-pepper-please-change}
    # Base64 of 32 random bytes. Empty = insecure dev key (warned at startup).
    encryption-key: ${BEANGATE_ENCRYPTION_KEY:}
    # Protects /admin/**. CHANGE IN PRODUCTION.
    admin-token: ${BEANGATE_ADMIN_TOKEN:dev-admin-token}
  upstream:
    connect-timeout-ms: 3000
    response-timeout-ms: 120000
    # Time to first byte on a stream, and the maximum gap between two chunks afterwards.
    ttft-timeout-ms: 30000
    stream-idle-timeout-ms: 60000
  rate-limit:
    # Fail-open if Redis is unreachable; disable entirely for tests that run without Redis.
    enabled: true
  usage:
    queue-capacity: 10000
    batch-size: 500
    flush-interval-ms: 200

logging:
  level:
    io.beangate: INFO
